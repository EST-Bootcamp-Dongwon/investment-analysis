version: '3.9'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    container_name: investment_backend
    restart: unless-stopped
    ports:
    - 8800:8000
    env_file:
    - app/backend/.env
    environment:
    - MONGODB_URL=mongodb://mongo:27017
    - MONGODB_DB=investment_db
    - QDRANT_URL=http://qdrant:6333
    volumes:
    - ./docs:/app/docs:ro
    networks:
    - shared-net
networks:
  shared-net:
    external: true

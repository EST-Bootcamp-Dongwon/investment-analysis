name: Build and Deploy

on:
# 2026-07-30: 계정 이관 과정에서 자동 실행을 차단했다.
# 이 폴더가 별도 저장소로 분리되면 루트 워크플로가 되어 push마다 자동 실행되므로,
# push 트리거를 제거하고 수동 실행(workflow_dispatch)만 남긴다.
# 재활성화하려면 아래 push 블록을 복원하기 전에 저장소 Secrets부터 등록한다.
# (2026-08-03 강사님 원본 merge 시 최신 paths-ignore 를 그대로 주석에 반영했다.)
#
#  push:
#    branches: [main]
#    paths-ignore:
#      - "readme.md"
#      - "image.png"
#      - ".claude/**"
#      - ".github/workflows/deploy-stock-trade.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

# 최신 커밋만 EC2에 배포해 동시에 실행된 이전 배포가 최신 이미지를 덮어쓰지 않게 한다.
concurrency:
  group: investment-analysis-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # GHCR 저장소 이름은 소문자만 허용한다. 조직명 EST-Bootcamp-Dongwon 을 그대로 쓰면
      # "repository name must be lowercase" 로 push 가 실패하므로 여기서 소문자로 바꾼다.
      - name: Compute image name
        id: image
        run: echo "image=ghcr.io/${OWNER,,}/investment-analysis-backend" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Markdown document changes
        id: docs_changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD -- docs/ | grep -qE '\.md$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -H "$SSH_HOST" > "$RUNNER_TEMP/known_hosts" 2>/dev/null && \
              test -s "$RUNNER_TEMP/known_hosts"; then
              cat "$RUNNER_TEMP/known_hosts" >> ~/.ssh/known_hosts
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "Unable to read the SSH host key for $SSH_HOST" >&2
              exit 1
            fi
            sleep 5
          done
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Write backend .env
        run: |
          cat > /tmp/backend.env <<EOF
          DART_API_KEY=$DART_API_KEY
          KOSIS_API_KEY=$KOSIS_API_KEY
          BOK_API_KEY=$BOK_API_KEY
          AWS_ACCESS_KEY_ID=$LEX_AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$LEX_AWS_SECRET_ACCESS_KEY
          AWS_REGION=us-east-1
          LEX_BOT_ID=SE3NCP7NMP
          LEX_BOT_ALIAS_ID=ZJFW9O3LZM
          LEX_LOCALE_ID=ko_KR
          EOF
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          BOK_API_KEY: ${{ secrets.BOK_API_KEY }}
          LEX_AWS_ACCESS_KEY_ID: ${{ secrets.LEX_AWS_ACCESS_KEY_ID }}
          LEX_AWS_SECRET_ACCESS_KEY: ${{ secrets.LEX_AWS_SECRET_ACCESS_KEY }}

      # Only the compose file + .env travel to the server — the web app
      # itself is pulled from GHCR, not copied over SSH.
      - name: Upload compose file + env
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_PATH/app/backend"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.prod.yml"
          scp -i ~/.ssh/deploy_key /tmp/backend.env "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/app/backend/.env"
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: /opt/investment-analysis

      - name: Pull image and restart backend
        run: |
          echo "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "sudo docker login ghcr.io -u $GHCR_ACTOR --password-stdin"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            set -e
            cd $DEPLOY_PATH
            # 새 이미지를 받기 전에 실행 중이지 않은 컨테이너·이미지만 정리한다.
            # MongoDB·Qdrant 볼륨과 실행 중인 서비스는 삭제하지 않는다.
            sudo docker container prune -f
            sudo docker image prune -af
            # 배포 서버(Ubuntu 26.04)의 sudo 는 -E 를 줘도 환경변수를 넘기지 않아
            # export + 'sudo -E' 방식은 BACKEND_IMAGE 가 유실되고 엉뚱한 기본 이미지가 뜬다.
            # compose 가 프로젝트 디렉터리의 .env 를 자동으로 읽는 성질을 이용해 파일로 전달한다.
            printf 'BACKEND_IMAGE=%s\n' '$IMAGE:$GITHUB_SHA' > $DEPLOY_PATH/.env
            sudo docker compose -f docker-compose.prod.yml pull backend
            sudo docker compose -f docker-compose.prod.yml up -d
            sudo docker image prune -f
          "
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: /opt/investment-analysis
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build.outputs.image }}

      - name: Reindex RAG documents
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            set -e
            cd $DEPLOY_PATH
            sudo docker compose -f docker-compose.prod.yml exec -T backend \
              bash /app/scripts/upload_docs_to_qdrant.sh
          "
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: /opt/investment-analysis

      - name: Reindex full-text search documents
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "
            set -e
            cd $DEPLOY_PATH
            sudo docker compose -f docker-compose.prod.yml exec -T backend \
              python /app/scripts/index_docs_meilisearch.py
          "
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_PATH: /opt/investment-analysis

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "curl -sf http://localhost:8801/api/health"
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

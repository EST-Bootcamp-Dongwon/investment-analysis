name: Deploy stock-coin-trade

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stock-coin-trade-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 강사님 원본이 아니라 작업본(fork)을 배포한다. 원본을 받으면
      # 커스터마이징한 코드가 아닌 강의 원본이 올라가 버린다.
      - name: Check out stock-coin-trade source
        uses: actions/checkout@v4
        with:
          repository: EST-Bootcamp-Dongwon/stock-coin-trade
          ref: main
          path: stock-coin-trade

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 -H "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Upload application source
        working-directory: stock-coin-trade
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=__pycache__ \
            -czf - . | ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            'sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/stock-coin-trade && tar -xzf - -C /opt/stock-coin-trade'
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # 개인 도메인이 없으므로 호스트 nginx·HTTPS 설정은 하지 않는다.
      # frontend 컨테이너 안의 nginx 가 API 프록시까지 모두 처리하므로
      # 포트(3000)만 열어 두면 그대로 접속된다.
      # investment-analysis 는 8801 을 쓰므로 포트가 겹치지 않는다.
      - name: Configure and start application
        run: |
          cat > /tmp/stock-trade.override.yml <<'EOF'
          services:
            python-backend:
              environment:
                SECRET_KEY: ${SECRET_KEY}
          EOF

          scp -i ~/.ssh/deploy_key /tmp/stock-trade.override.yml "$SSH_USER@$SSH_HOST:/tmp/stock-trade.override.yml"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            set -e
            sudo install -m 644 /tmp/stock-trade.override.yml /opt/stock-coin-trade/docker-compose.prod.yml
            # 이 서버의 sudo 는 환경변수를 자식 프로세스로 넘기지 않는다(Ubuntu 26.04 sudo-rs).
            # 그래서 비밀값은 반드시 compose 프로젝트 디렉터리의 .env 파일로 전달한다.
            if [ ! -f /opt/stock-coin-trade/.env ]; then
              umask 077
              printf "SECRET_KEY=%s\n" "$(openssl rand -hex 32)" > /opt/stock-coin-trade/.env
            fi
            cd /opt/stock-coin-trade
            sudo docker compose -p stock-coin-trade -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            sudo docker image prune -f
          '
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Verify deployed service
        run: |
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            for i in $(seq 1 30); do
              curl --fail --silent --show-error http://127.0.0.1:3000/ >/dev/null && exit 0
              sleep 5
            done
            echo "헬스체크 실패"
            sudo docker compose -p stock-coin-trade logs --tail 50
            exit 1
          '
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

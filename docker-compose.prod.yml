# 배포할 이미지는 같은 폴더의 .env 에 BACKEND_IMAGE 로 지정한다.
# (서버의 sudo 가 환경변수를 넘기지 못해 export 방식은 조용히 무시된다.)
# 아래 기본값은 .env 가 없을 때만 쓰이며, 강사님 원본이 아닌 우리 포크 이미지를 가리킨다.
services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/est-bootcamp-dongwon/investment-analysis-backend:latest}
    container_name: investment_backend
    restart: unless-stopped
    ports:
      - "8801:8000"
    env_file:
      - app/backend/.env
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=investment_db
      - QDRANT_URL=http://qdrant:6333
      - MEILI_URL=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-local-development-search-key-change-me}
      - RAG_EMBEDDING_PROVIDER=hash
      - RAG_LLM_API_KEY=
      - RAG_LLM_MODEL=
    depends_on:
      - mongo
      - qdrant
      - meilisearch
    networks:
      - investment-net

  mongo:
    image: mongo:7
    container_name: investment_mongo
    restart: unless-stopped
    volumes:
      - investment_mongo_data:/data/db
    networks:
      - investment-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: investment_qdrant
    restart: unless-stopped
    volumes:
      - investment_qdrant_data:/qdrant/storage
    networks:
      - investment-net

  meilisearch:
    image: getmeili/meilisearch:v1.15.2
    container_name: investment_meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-local-development-search-key-change-me}
    volumes:
      - investment_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7700/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - investment-net

networks:
  investment-net:
    driver: bridge

volumes:
  investment_mongo_data:
  investment_qdrant_data:
  investment_meilisearch_data:
